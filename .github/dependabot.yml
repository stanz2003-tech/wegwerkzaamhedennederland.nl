# Dependabot: one grouped pull request per month for npm (minor/patch only) and for the
# GitHub Actions used in .github/workflows. Security updates are separate and always on
# (repository Settings > Advanced Security > Dependabot security updates).
#
# The owner may ignore or close these pull requests; nothing breaks when they stay open.
# Major versions are excluded on purpose: they can require code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
