<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
{{#if adsenseAccount}}<meta name="google-adsense-account" content="{{adsenseAccount}}">
{{/if}}<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{site.longName}}">
<meta property="og:locale" content="nl_NL">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
{{#if ogImage}}<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Kan ik erdoor? Wegwerk: alle wegwerkzaamheden en afsluitingen van Nederland op één kaart">
<meta name="twitter:card" content="summary_large_image">
{{else}}<meta name="twitter:card" content="summary">
{{/if}}<meta name="twitter:title" content="{{ogTitle}}">
<meta name="twitter:description" content="{{description}}">
<meta name="theme-color" content="#15171b">
<!-- @head-theme -->
<noscript><style>.entity-forecast[data-pending] { display: none; } .entity-forecast[data-reserve] { min-height: 0; }</style></noscript>
<link rel="preload" href="/fonts/ibm-plex-sans-latin-868a235a.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script type="application/ld+json">{{{jsonld}}}</script>
