# Wegwerk wekker — Cloudflare Worker that starts the Data workflow on a reliable schedule.
# Deploy:  npx wrangler deploy        (from infra/worker/)
# Secret:  npx wrangler secret put GITHUB_TOKEN
#
# Everything here fits the Workers Free plan: 5 cron triggers per account, 10 ms CPU per
# invocation and 50 subrequests. One invocation makes at most four requests and spends its time
# waiting on the network, which does not count towards CPU time.

name = "wegwerk-wekker"
main = "src/index.mjs"
compatibility_date = "2026-09-16"

# Every 10 minutes. NDW republishes the live feed roughly every minute and the planning feed about
# every quarter of an hour, so 10 minutes keeps files and incidents useful without asking GitHub
# for more runs than the work justifies. Raising this to "*/5" is a one-line change: measured in
# steady state a run takes 9,4 s and rewrites 17 of 749 files, so even 5 minutes stays inside the
# free R2 write budget (about 173.000 of the 1.000.000 class A operations per month).
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

[vars]
GITHUB_REPO = "stanz2003-tech/wegwerkzaamhedennederland.nl"
WORKFLOW_FILE = "data.yml"
GITHUB_REF = "main"
DATA_META_URL = "https://data.wegwerkzaamhedennederland.nl/v1/meta.json"
SITE_URL = "https://www.wegwerkzaamhedennederland.nl/"
# Three times the cron interval: one missed run is normal, three in a row is a fault worth an alarm.
MAX_DATA_AGE_MINUTES = "30"

# Secrets — never in this file, set them with `wrangler secret put` or in the dashboard:
#   GITHUB_TOKEN     fine-grained PAT, Actions: read and write, this repository only (required)
#   HEALTHCHECK_URL  healthchecks.io ping URL, pinged only when the whole chain is healthy (optional)
